server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api/* goes to the backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200M;   # allow large resume/zip uploads
        proxy_read_timeout 300s;     # matching can take a while for big batches
    }
}
